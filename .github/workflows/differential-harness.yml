# The differential harness's gate run (#555, plan rev 10 "The gate"), job 2 of 2. Its file and
# scripts are protected paths: on the rewrite branch's PR, job 1 (differential-paths.yml) proves
# they are main's. The run compares every cell with its golden, bytes included, under the verify
# key, in the pinned image; scripts/differential-gate.sh fails it closed.

name: Differential harness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: differential harness (goldens)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
    steps:
    - uses: actions/checkout@v4

    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-

    - name: Install python3
      run: scripts/ci-apt-install.sh python3  # apt retried on mirror errors (#453)

    # The lists of expected differences and retired rows are main's everywhere but on the rewrite
    # branch's PR (head `rewrite/546-*` in this repository, not a fork), where the self-check
    # doesn't require them empty. A merge group requires them empty.
    - name: Gate run
      env:
        SST_DIFFERENTIAL_MAIN_LISTS: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'rewrite/546-') && github.event.pull_request.head.repo.full_name == github.repository) && '0' || '1' }}
      run: scripts/differential-gate.sh
