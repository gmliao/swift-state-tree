# This workflow will build and test Swift project on Linux
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build & Test

on:
  push:
    # Merges into experiment branches (exp/**) get a run of their own, as main does.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) take reviewed PRs too; they get the same CI.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  # The nightly (nightly.yml) calls this workflow with full_matrix: true. The work the push runs
  # leave out (Notes/plans/2026-11-19-ci-test-audit.md, V1–V5) is kept behind that input.
  workflow_call:
    inputs:
      full_matrix:
        description: Run the variant reruns the push runs leave out
        type: boolean
        default: false

# A new push to a pull request cancels that pull request's run still in progress. Nothing else
# shares a group, so nothing else is ever cancelled: a push (main, exp/**) and every call from the
# nightly (`full_matrix`, whatever event started the nightly) each get a group of their own run.
# That matters even with cancel-in-progress false: GitHub keeps one pending run per group and
# cancels the older pending one. The prefix keeps this workflow's groups apart from
# the other called workflow's in the same nightly run, which shares its run_id.
concurrency:
  group: build-and-test-${{ github.event_name == 'pull_request' && !inputs.full_matrix && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.full_matrix }}

jobs:
  build:
    name: build (in-turn sync ${{ matrix.in_turn_sync }})
    runs-on: ubuntu-22.04 # Linux runner (matching production environment)
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
    strategy:
      fail-fast: false
      matrix:
        # The kill switch: "false" runs the whole suite on the legacy sync path.
        in_turn_sync: ["true", "false"]
    env:
      IN_TURN_SYNC: ${{ matrix.in_turn_sync }}

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-

    # Lessons enforced in code (CLAUDE.md § Coding Conventions); the self-test proves the
    # checks still find what they look for before the repository is checked for zero findings.
    # This step, Lint turns and Must-not-compile snippets read source text or compile snippets:
    # IN_TURN_SYNC, the legs' only difference, is read at run time, so they give the same result in
    # both legs. On a push they run in the in-turn sync true leg only; the nightly runs them in both.
    # The shellcheck job checks that (scripts/check-variant-test-selection.sh, S4 and S6).
    - name: Lint lessons
      if: ${{ matrix.in_turn_sync == 'true' || inputs.full_matrix }}
      run: |
        scripts/lint-lessons.sh --self-test
        scripts/lint-lessons.sh

    # The turn core's rules the compiler can't check (Notes/plans/2026-11-18-swift-state-turns-core.md §7).
    - name: Lint turns
      if: ${{ matrix.in_turn_sync == 'true' || inputs.full_matrix }}
      run: |
        scripts/lint-turns.sh --self-test
        scripts/lint-turns.sh

    # `swift package clean` only: on a fresh runner there is no .build yet (the build is the next
    # step), so `rm -rf .build` removed nothing.
    - name: Clean build artifacts
      run: swift package clean
    
    - name: Show toolchain
      run: swift --version
    
    - name: Build
      run: swift build

    # Handler bodies that must not compile (#586): a throw after the write, a wrong response type,
    # validate's context. Each snippet builds as a target of a generated package under .build/.
    - name: Must-not-compile snippets
      if: ${{ matrix.in_turn_sync == 'true' || inputs.full_matrix }}
      run: scripts/check-must-not-compile.sh
    
    - name: Run tests
      run: swift test
      timeout-minutes: 30

    # The wall-clock cadence smoke, in a process of its own: beside the parallel suite, CPU-heavy
    # neighbours can starve it. It fails the job when it didn't run (a renamed suite or test
    # would otherwise match nothing and pass).
    - name: Run wall-clock tests
      shell: bash
      run: |
        set -o pipefail
        WALL_CLOCK_TESTS=1 swift test --skip-build --no-parallel --filter WallClockCadenceSmokeTests 2>&1 | tee wall-clock.log
        if ! grep -q '✔ Test "cadence smoke (wall clock)' wall-clock.log; then
          echo "::error::the wall-clock cadence smoke did not run"
          exit 1
        fi
      timeout-minutes: 5

  # The turn core in release (its debug run is the build job's `swift test`): the ordered,
  # model and runtime-stop checks, and the step path's specialization for a client's machine.
  turns-release:
    name: turns (release)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache, as in the build job: keyed by the image digest and the tracked
    # Package.resolved files. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-

    - name: Show toolchain
      run: swift --version

    - name: Run the turn core's tests in release
      run: swift test -c release --filter "SwiftStateTurnsTests|SwiftStateTurnsMacrosTests"
      timeout-minutes: 40

    # Nightly only: the same tests in release with the turn core's runtime exclusivity checks
    # back on (TURNS_EXCLUSIVITY_CHECKED lifts `@exclusivity(unchecked)` on its stored state,
    # #624), so an overlapping access the unchecked build would let through traps here.
    - name: Run the turn core's tests in release with exclusivity checked
      if: ${{ inputs.full_matrix }}
      run: swift test -c release -Xswiftc -DTURNS_EXCLUSIVITY_CHECKED --filter "SwiftStateTurnsTests|SwiftStateTurnsMacrosTests"
      timeout-minutes: 40

    - name: Check the step path's specialization
      run: scripts/check-turns-inlinable.sh

  # The broadcast diff on the typed sync tables and typed leaf values are on by default. This
  # job runs the tests again with both opted out (USE_SYNC_TABLES=false, TYPED_LEAF_VALUES=false),
  # so the snapshot-diff fallback keeps coverage until it is removed. On a push it runs only the
  # Transport and NIO targets: the flags reach no other test, which the shellcheck job checks
  # (scripts/check-variant-test-selection.sh: the other targets that reach the
  # transport pin both flags on every config). The nightly runs the whole suite here.
  # In-turn sync is at its default. Row addressing (on by default) keeps the tables on whatever
  # USE_SYNC_TABLES says, and in-process configs don't read ROW_ADDRESSING: a test with rows in
  # effect (a router join with the sync sequence and path hashes) runs the tables here too. The
  # job covers the direct-adapter tests and those without router joins, the sync sequence or path
  # hashes; the fallback under a router join is covered by the tests that turn rows off
  # explicitly (`withRowAddressing(false)`).
  sync-tables-off:
    name: build (sync tables off)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
    env:
      USE_SYNC_TABLES: "false"
      TYPED_LEAF_VALUES: "false"

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-

    - name: Show toolchain
      run: swift --version

    # It fails the job when the tests that pin the switches didn't run (a renamed target or
    # test would otherwise match nothing and pass). They check the adapter's effective state,
    # not only the environment.
    - name: Run the tests with the tables and typed leaves off
      shell: bash
      env:
        FILTER: ${{ !inputs.full_matrix && 'SwiftStateTreeTransportTests\.|SwiftStateTreeNIOTests\.' || '' }}
      run: |
        set -o pipefail
        swift test ${FILTER:+--filter "$FILTER"} 2>&1 | tee sync-tables-off.log
        for pin in 'A config built with init takes USE_SYNC_TABLES' 'A config built with init takes TYPED_LEAF_VALUES'; do
          if ! grep -q "✔ Test \"$pin" sync-tables-off.log; then
            echo "::error::the test \"$pin\" did not run"
            exit 1
          fi
        done
      timeout-minutes: 40

  # Per-player fields on typed per-player tables (#514) are on by default wherever the broadcast
  # tables are. This job runs the Transport and NIO targets again with them opted out
  # (PER_PLAYER_SYNC_TABLES=false), the broadcast tables at their default, so today's per-player
  # snapshot diff keeps coverage. The identity tests toggle the three configurations in process.
  per-player-sync-tables-off:
    name: build (per-player sync tables off)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
    env:
      PER_PLAYER_SYNC_TABLES: "false"

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-

    - name: Show toolchain
      run: swift --version

    # It fails the job when the test that pins the switch didn't run.
    - name: Run the Transport and NIO tests with the per-player tables off
      shell: bash
      run: |
        set -o pipefail
        swift test --filter 'SwiftStateTreeTransportTests\.|SwiftStateTreeNIOTests\.' 2>&1 | tee per-player-sync-tables-off.log
        pin='A config built with init takes PER_PLAYER_SYNC_TABLES'
        if ! grep -q "✔ Test \"$pin" per-player-sync-tables-off.log; then
          echo "::error::the test \"$pin\" did not run"
          exit 1
        fi
      timeout-minutes: 40

  # The Examples packages have their own test targets and builds, which the root `swift test`
  # does not cover. One configuration: the GameDemo tests drive keepers without a transport.
  # The Demo tests pin its lands' sync table fallback lists.
  examples:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12-

    - name: Show toolchain
      run: swift --version

    - name: GameDemo tests
      working-directory: Examples/GameDemo
      run: swift test
      timeout-minutes: 30

    # The GameDemo pacing tests that bound wall-clock time, in a process of their own (#466):
    # beside the parallel suite, another test's subprocess delays their wakes. It fails the job
    # when they didn't run (a renamed suite would otherwise match nothing and pass). The log goes
    # to the runner's temp directory: the working tree must stay unchanged.
    - name: GameDemo wall-clock tests
      working-directory: Examples/GameDemo
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/gamedemo-wall-clock.log"
        WALL_CLOCK_TESTS=1 swift test --skip-build --no-parallel --filter LoadTestPacingWallClockTests 2>&1 | tee "$log"
        if ! grep -q '✔ Suite "LoadTestPacing (wall clock)" passed' "$log"; then
          echo "::error::the GameDemo wall-clock tests did not run"
          exit 1
        fi
      timeout-minutes: 5

    - name: Demo build
      working-directory: Examples/Demo
      run: swift build
      timeout-minutes: 30

    - name: Demo tests
      working-directory: Examples/Demo
      run: swift test
      timeout-minutes: 20

    - name: Tracked files unchanged by the tests
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "The Examples tests or builds changed the working tree:"
          echo "$status"
          exit 1
        fi
        # Ignored files too: records written into reevaluation-records/ are gitignored (a local
        # backstop), so the check above would not see a test that writes there again.
        ignored="$(git status --porcelain --ignored -- Examples/GameDemo/reevaluation-records | grep '^!!' || true)"
        if [ -n "$ignored" ]; then
          echo "The Examples tests wrote files into Examples/GameDemo/reevaluation-records/:"
          echo "$ignored"
          exit 1
        fi

    # A change to the schema or to codegen must regenerate its checked-in consumers in the same
    # change: regenerate both examples' schema.json and their WebClient codegen output, and fail
    # on any difference.
    - name: Regenerate example schemas
      run: |
        (cd Examples/Demo && swift run SchemaGen --output schema.json)
        (cd Examples/GameDemo && swift run SchemaGen --output schema.json)
      timeout-minutes: 15

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Regenerate WebClient codegen
      run: |
        npm ci --prefix sdk/ts
        npm run codegen --prefix Examples/Demo/WebClient
        npm run codegen --prefix Examples/GameDemo/WebClient

    - name: Generated files are current
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "::error::Regenerating the example schemas or WebClient codegen changed checked-in files."
          echo "Run, and commit the result:"
          echo "  (cd Examples/Demo && swift run SchemaGen --output schema.json) && (cd Examples/Demo/WebClient && npm run codegen)"
          echo "  (cd Examples/GameDemo && swift run SchemaGen --output schema.json) && (cd Examples/GameDemo/WebClient && npm run codegen)"
          echo "$status"
          git --no-pager diff --stat
          git --no-pager diff | sed -n 1,200p
          exit 1
        fi

    # EncodingBenchmark's --join-through-router / --row-addressing: the refused combinations exit 2
    # with their reason (row-specific ones only for an explicit `on`), and small router runs (rows
    # by default, on and off) join every session and record perConnection bytes and whether row
    # entries were in effect. Reuses the tests' debug build.
    # The router check parses the benchmark's JSON with python3, which the image doesn't have.
    - name: Install python3
      run: scripts/ci-apt-install.sh python3  # apt retried on mirror errors (#453)

    - name: EncodingBenchmark router flags
      working-directory: Examples/GameDemo
      shell: bash
      run: scripts/check-encoding-benchmark-router.sh
      timeout-minutes: 10

  # The deep-research Python tests, in a job of their own: they need no Swift build, so they run
  # beside the Swift jobs instead of after the examples job's builds. On the runner itself, not
  # in the Swift image: the tests need no Swift build and no particular Swift version, only
  # Python, git and Node, and the image has no python3 binary. Python 3.12 and Node 20 come
  # from official builds, so the job doesn't depend on the Ubuntu mirrors (#453, #635); the
  # full history.
  deep-research-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: deep-research's wire-form tests resolve recorded commits and their parents.
        fetch-depth: 0

    # Python 3.12, the version the Swift image's apt gave this job before (3.12.3), from the
    # official builds: a slow archive.ubuntu.com used up the test step's budget (#635).
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Every tracked deep-research Python test (standard library, git and node only), each from its
    # own directory. Every file runs; a file fails on a non-zero exit or when its output does not
    # report at least one test run (so a file that runs nothing can't pass). Each failing file is
    # named, and any failure fails the job.
    - name: deep-research Python tests
      shell: bash
      run: |
        python3 --version
        log="$(mktemp)"
        count=0
        failed=()
        summary=()
        while IFS= read -r -d '' f; do
          count=$((count + 1))
          echo "::group::$f"
          # Actions runs this with `bash -eo pipefail`: capture the status instead of exiting on it.
          rc=0
          (cd "$(dirname "$f")" && python3 "$(basename "$f")") > "$log" 2>&1 || rc=$?
          cat "$log"
          echo "::endgroup::"
          if [ $rc -ne 0 ]; then
            echo "::error file=$f::$f failed (exit $rc)"
            failed+=("$f")
          elif ! grep -qE '^Ran [1-9][0-9]* tests? in ' "$log"; then
            echo "::error file=$f::$f exited 0 but reported no tests run"
            failed+=("$f")
          fi
          # `|| true`: a file with no such line is already in the failed list; keep going.
          ran="$(grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -1 || true)"
          # unittest's summary: the first OK/FAILED line after the last "Ran N tests" line, not a
          # test's own output that happens to start with OK.
          result="$(awk '/^Ran [0-9]+ tests? in /{r=NR; line=""} r && NR>r && line=="" && /^(OK|FAILED)( |$)/{line=$0} END{print line}' "$log")"
          summary+=("$f: ${ran% in *}, ${result:-no result line}")
        done < <(git ls-files -z 'deep-research/*test_*.py' 'deep-research/**/test_*.py')
        if [ $count -eq 0 ]; then
          echo "::error::no deep-research Python tests found"
          exit 1
        fi
        printf '%s\n' "${summary[@]}"
        echo "$count deep-research test files run"
        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed deep-research tests:"
          printf '  %s\n' "${failed[@]}"
          exit 1
        fi
      timeout-minutes: 10

  # No new wall-clock polls in the tests (#457): counts above scripts/wall-clock-baseline.txt
  # fail, and so do counts below it until it is lowered. On a pull request, a count raised over
  # the base branch's baseline prints `BASELINE RAISED` and a warning; the PR states the reason.
  wall-clock-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Wall-clock polls in tests
      shell: bash
      run: |
        scripts/lint-wall-clock-tests.sh --self-test
        base=()
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:scripts/wall-clock-baseline.txt > "$RUNNER_TEMP/base-baseline.txt" 2>/dev/null \
            || : > "$RUNNER_TEMP/base-baseline.txt"
          base=(--base-baseline "$RUNNER_TEMP/base-baseline.txt")
        fi
        scripts/lint-wall-clock-tests.sh "${base[@]}"
      timeout-minutes: 5

  # Every tracked shell script passes ShellCheck (options in .shellcheckrc). A finding is fixed, or
  # disabled on its line with the reason beside it. The pinned release is checked against its hash.
  shellcheck:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    # The nightly's gate and report, against a stub gh. The report only runs on scheduled runs,
    # so nothing else would try it before a red main needs it.
    - name: Nightly scripts
      run: scripts/test-nightly-scripts.sh
      timeout-minutes: 2

    # One digest for every Swift container image, named by every SwiftPM cache key. The self-test
    # proves the check still finds what it looks for before the workflows are checked.
    - name: Swift image pinned by one digest
      run: |
        scripts/check-ci-image-pin.sh --self-test
        scripts/check-ci-image-pin.sh

    # The push runs leave out repeated variant runs, which is safe only while the variable can't
    # change what they check: sync-tables-off runs only the Transport and NIO targets (no other test
    # can read USE_SYNC_TABLES or TYPED_LEAF_VALUES), and the build job's in-turn sync false leg
    # skips three steps that can't read IN_TURN_SYNC. Here, not in those jobs: the check is Python,
    # which the Swift image lacks, and the runner's own Swift only parses the manifest
    # (`swift package dump-package`) for the test targets' dependencies.
    - name: The variant runs left out can't read their variable
      run: |
        swift --version
        scripts/check-variant-test-selection.sh --self-test
        scripts/check-variant-test-selection.sh

    - name: Install ShellCheck 0.11.0
      run: |
        curl -sSfL --retry 3 --retry-all-errors -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
        echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
        tar -xJf /tmp/shellcheck.tar.xz -C /tmp
        sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
        shellcheck --version

    # The topic run scripts below are excluded until their topics' data is recorded (a change there
    # moves the measured commit); their findings are tracked in #316. An excluded script that
    # passes fails the step, so the exclusion is dropped with the fix.
    - name: ShellCheck every tracked script
      shell: bash
      run: |
        excluded='^deep-research/(entity-delta-baseline|multiroom-load-2026-11|network-impairment-2026-11|single-room-entity-scaling|snapshot-baseline|visibility)/run\.sh$'
        mapfile -d '' files < <(git ls-files -z '*.sh' '*.bash' | grep -zvE "$excluded")
        mapfile -d '' held < <(git ls-files -z '*.sh' '*.bash' | grep -zE "$excluded")
        echo "ShellCheck on ${#files[@]} scripts (${#held[@]} excluded)"
        [ "${#files[@]}" -gt 0 ] || { echo "::error::no tracked shell scripts found"; exit 1; }
        shellcheck "${files[@]}"
        for f in "${held[@]}"; do
          if shellcheck "$f" > /dev/null; then
            echo "::error file=$f::$f has no findings now: remove it from the exclusion"
            exit 1
          fi
        done
      timeout-minutes: 5

  test-typescript-sdk:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
      env:
        NODE_VERSION: 20

    steps:
    - uses: actions/checkout@v4
    
    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: sdk/ts
      run: npm ci
    
    - name: Build TypeScript SDK
      working-directory: sdk/ts
      run: npm run build
    
    # The build config leaves the tests out and vitest strips types without checking them, so the
    # test files (and the schemas they build) are type-checked here.
    - name: Type-check the SDK with its tests
      working-directory: sdk/ts
      run: npm run typecheck

    - name: Run TypeScript SDK tests
      working-directory: sdk/ts
      run: npm test

  test-ws-loadtest:
    # ws-loadtest is CommonJS and loads the ESM SDK (file: dependency) through a native dynamic
    # import. Pinned to Node 20: no require(esm), the strictest loader it supports.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          sdk/ts/package-lock.json
          Examples/GameDemo/ws-loadtest/package-lock.json

    - name: Install and build TypeScript SDK
      working-directory: sdk/ts
      # npm ci runs the SDK's prepare script, which builds it.
      run: |
        node --version
        npm ci

    - name: Install and build ws-loadtest
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        npm ci
        npm run build

    - name: Run ws-loadtest tests
      working-directory: Examples/GameDemo/ws-loadtest
      run: npm test

    - name: Load the SDK from the compiled CLI
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        node -e '
          const ce = require("./dist/client-events");
          ce.loadFixedPointTypes().then((types) => {
            const payload = ce.payloadGenerators(types).moveTo(ce.eventRandom(42, "MoveTo", "rfixture-room-p5-0-s0"));
            const expected = require("./tests/fixtures/move-to-seed42.json").payloads[0];
            if (JSON.stringify(payload) !== JSON.stringify(expected)) {
              console.error("unexpected payload", JSON.stringify(payload));
              process.exit(1);
            }
            console.log("moveTo payload", JSON.stringify(payload));
          }).catch((error) => { console.error(error); process.exit(1); });
        '
