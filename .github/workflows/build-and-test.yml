# This workflow will build and test Swift project on Linux
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build & Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'

jobs:
  build:
    name: build (in-turn sync ${{ matrix.in_turn_sync }})
    runs-on: ubuntu-22.04 # Linux runner (matching production environment)
    container:
      image: swift:6.2.4-noble
    strategy:
      fail-fast: false
      matrix:
        # The kill switch: "false" runs the whole suite on the legacy sync path.
        in_turn_sync: ["true", "false"]
    env:
      IN_TURN_SYNC: ${{ matrix.in_turn_sync }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Clean build artifacts
      run: |
        rm -rf .build
        swift package clean
    
    - name: Show toolchain
      run: swift --version
    
    - name: Build
      run: swift build
    
    - name: Run tests
      run: swift test
      timeout-minutes: 30

  # The Examples packages have their own test targets and builds, which the root `swift test`
  # does not cover. One configuration: the GameDemo tests drive keepers without a transport.
  examples:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble

    steps:
    - uses: actions/checkout@v4

    - name: Show toolchain
      run: swift --version

    - name: GameDemo tests
      working-directory: Examples/GameDemo
      run: swift test
      timeout-minutes: 30

    - name: Demo build
      working-directory: Examples/Demo
      run: swift build
      timeout-minutes: 30

    - name: Tracked files unchanged by the tests
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "The Examples tests or builds changed the working tree:"
          echo "$status"
          exit 1
        fi
        # Ignored files too: records written into reevaluation-records/ are gitignored (a local
        # backstop), so the check above would not see a test that writes there again.
        ignored="$(git status --porcelain --ignored -- Examples/GameDemo/reevaluation-records | grep '^!!' || true)"
        if [ -n "$ignored" ]; then
          echo "The Examples tests wrote files into Examples/GameDemo/reevaluation-records/:"
          echo "$ignored"
          exit 1
        fi

  test-typescript-sdk:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble
      env:
        NODE_VERSION: 20

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      run: |
        apt-get update
        apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version && npm --version
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: sdk/ts
      run: npm ci
    
    - name: Build TypeScript SDK
      working-directory: sdk/ts
      run: npm run build
    
    - name: Run TypeScript SDK tests
      working-directory: sdk/ts
      run: npm test
