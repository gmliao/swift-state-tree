# This workflow will build and test Swift project on Linux
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build & Test

on:
  push:
    # Merges into experiment branches (exp/**) get a run of their own, as main does.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) take reviewed PRs too; they get the same CI.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'

jobs:
  build:
    name: build (in-turn sync ${{ matrix.in_turn_sync }})
    runs-on: ubuntu-22.04 # Linux runner (matching production environment)
    container:
      image: swift:6.2.4-noble
    strategy:
      fail-fast: false
      matrix:
        # The kill switch: "false" runs the whole suite on the legacy sync path.
        in_turn_sync: ["true", "false"]
    env:
      IN_TURN_SYNC: ${{ matrix.in_turn_sync }}

    steps:
    - uses: actions/checkout@v4

    # Lessons enforced in code (CLAUDE.md § Coding Conventions); the self-test proves the
    # checks still find what they look for before the repository is checked for zero findings.
    - name: Lint lessons
      run: |
        scripts/lint-lessons.sh --self-test
        scripts/lint-lessons.sh

    - name: Clean build artifacts
      run: |
        rm -rf .build
        swift package clean
    
    - name: Show toolchain
      run: swift --version
    
    - name: Build
      run: swift build
    
    - name: Run tests
      run: swift test
      timeout-minutes: 30

    # The wall-clock cadence smoke, in a process of its own: beside the parallel suite, CPU-heavy
    # neighbours can starve it. It fails the job when it didn't run (a renamed suite or test
    # would otherwise match nothing and pass).
    - name: Run wall-clock tests
      shell: bash
      run: |
        set -o pipefail
        WALL_CLOCK_TESTS=1 swift test --skip-build --no-parallel --filter WallClockCadenceSmokeTests 2>&1 | tee wall-clock.log
        if ! grep -q '✔ Test "cadence smoke (wall clock)' wall-clock.log; then
          echo "::error::the wall-clock cadence smoke did not run"
          exit 1
        fi
      timeout-minutes: 5

  # The broadcast diff on the typed sync tables (USE_SYNC_TABLES, off by default): the transport
  # and NIO test targets again with the switch on, so that side stays covered until the default
  # flips. Those targets hold the adapter's tests; the one adapter built in SwiftStateTreeTests
  # (the debug projection's wire shape) isn't run here. In-turn sync is at its default: the
  # legacy path with the tables on is left to the local full runs.
  sync-tables:
    name: build (sync tables on)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble
    env:
      USE_SYNC_TABLES: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Show toolchain
      run: swift --version

    # It fails the job when the test that pins the switch didn't run (a renamed target or test
    # would otherwise match nothing and pass).
    - name: Run the transport and NIO tests on the tables
      shell: bash
      run: |
        set -o pipefail
        swift test --filter 'SwiftStateTreeTransportTests|SwiftStateTreeNIOTests' 2>&1 | tee sync-tables.log
        if ! grep -q '✔ Test "A config built with init takes USE_SYNC_TABLES' sync-tables.log; then
          echo "::error::the test that pins USE_SYNC_TABLES did not run"
          exit 1
        fi
      timeout-minutes: 30

  # The Examples packages have their own test targets and builds, which the root `swift test`
  # does not cover. One configuration: the GameDemo tests drive keepers without a transport.
  examples:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: deep-research's wire-form tests resolve recorded commits and their parents.
        fetch-depth: 0

    - name: Show toolchain
      run: swift --version

    - name: GameDemo tests
      working-directory: Examples/GameDemo
      run: swift test
      timeout-minutes: 30

    - name: Demo build
      working-directory: Examples/Demo
      run: swift build
      timeout-minutes: 30

    - name: Tracked files unchanged by the tests
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "The Examples tests or builds changed the working tree:"
          echo "$status"
          exit 1
        fi
        # Ignored files too: records written into reevaluation-records/ are gitignored (a local
        # backstop), so the check above would not see a test that writes there again.
        ignored="$(git status --porcelain --ignored -- Examples/GameDemo/reevaluation-records | grep '^!!' || true)"
        if [ -n "$ignored" ]; then
          echo "The Examples tests wrote files into Examples/GameDemo/reevaluation-records/:"
          echo "$ignored"
          exit 1
        fi

    # A change to the schema or to codegen must regenerate its checked-in consumers in the same
    # change: regenerate both examples' schema.json and their WebClient codegen output, and fail
    # on any difference.
    - name: Regenerate example schemas
      run: |
        (cd Examples/Demo && swift run SchemaGen --output schema.json)
        (cd Examples/GameDemo && swift run SchemaGen --output schema.json)
      timeout-minutes: 15

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Regenerate WebClient codegen
      run: |
        npm ci --prefix sdk/ts
        npm run codegen --prefix Examples/Demo/WebClient
        npm run codegen --prefix Examples/GameDemo/WebClient

    - name: Generated files are current
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "::error::Regenerating the example schemas or WebClient codegen changed checked-in files."
          echo "Run, and commit the result:"
          echo "  (cd Examples/Demo && swift run SchemaGen --output schema.json) && (cd Examples/Demo/WebClient && npm run codegen)"
          echo "  (cd Examples/GameDemo && swift run SchemaGen --output schema.json) && (cd Examples/GameDemo/WebClient && npm run codegen)"
          echo "$status"
          git --no-pager diff --stat
          git --no-pager diff | sed -n 1,200p
          exit 1
        fi

    # Every tracked deep-research Python test (standard library, git and node only), each from its
    # own directory. Every file runs; a file fails on a non-zero exit or when its output does not
    # report at least one test run (so a file that runs nothing can't pass). Each failing file is
    # named, and any failure fails the job.
    - name: deep-research Python tests
      shell: bash
      run: |
        scripts/ci-apt-install.sh python3  # apt retried on mirror errors (#453)
        python3 --version
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        log="$(mktemp)"
        count=0
        failed=()
        while IFS= read -r -d '' f; do
          count=$((count + 1))
          echo "::group::$f"
          # Actions runs this with `bash -eo pipefail`: capture the status instead of exiting on it.
          rc=0
          (cd "$(dirname "$f")" && python3 "$(basename "$f")") > "$log" 2>&1 || rc=$?
          cat "$log"
          echo "::endgroup::"
          if [ $rc -ne 0 ]; then
            echo "::error file=$f::$f failed (exit $rc)"
            failed+=("$f")
          elif ! grep -qE '^Ran [1-9][0-9]* tests? in ' "$log"; then
            echo "::error file=$f::$f exited 0 but reported no tests run"
            failed+=("$f")
          fi
        done < <(git ls-files -z 'deep-research/*test_*.py' 'deep-research/**/test_*.py')
        if [ $count -eq 0 ]; then
          echo "::error::no deep-research Python tests found"
          exit 1
        fi
        echo "$count deep-research test files run"
        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed deep-research tests:"
          printf '  %s\n' "${failed[@]}"
          exit 1
        fi
      timeout-minutes: 10

  # No new wall-clock polls in the tests (#457): counts above scripts/wall-clock-baseline.txt
  # fail, and so do counts below it until it is lowered. On a pull request, a count raised over
  # the base branch's baseline prints `BASELINE RAISED` and a warning; the PR states the reason.
  wall-clock-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Wall-clock polls in tests
      shell: bash
      run: |
        scripts/lint-wall-clock-tests.sh --self-test
        base=()
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:scripts/wall-clock-baseline.txt > "$RUNNER_TEMP/base-baseline.txt" 2>/dev/null \
            || : > "$RUNNER_TEMP/base-baseline.txt"
          base=(--base-baseline "$RUNNER_TEMP/base-baseline.txt")
        fi
        scripts/lint-wall-clock-tests.sh "${base[@]}"
      timeout-minutes: 5

  # Every tracked shell script passes ShellCheck (options in .shellcheckrc). A finding is fixed, or
  # disabled on its line with the reason beside it. The pinned release is checked against its hash.
  shellcheck:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install ShellCheck 0.11.0
      run: |
        curl -sSfL --retry 3 --retry-all-errors -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
        echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
        tar -xJf /tmp/shellcheck.tar.xz -C /tmp
        sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
        shellcheck --version

    # The topic run scripts below are excluded until their topics' data is recorded (a change there
    # moves the measured commit); their findings are tracked in #316. An excluded script that
    # passes fails the step, so the exclusion is dropped with the fix.
    - name: ShellCheck every tracked script
      shell: bash
      run: |
        excluded='^deep-research/(entity-delta-baseline|multiroom-load-2026-11|network-impairment-2026-11|single-room-entity-scaling|snapshot-baseline|visibility)/run\.sh$'
        mapfile -d '' files < <(git ls-files -z '*.sh' '*.bash' | grep -zvE "$excluded")
        mapfile -d '' held < <(git ls-files -z '*.sh' '*.bash' | grep -zE "$excluded")
        echo "ShellCheck on ${#files[@]} scripts (${#held[@]} excluded)"
        [ "${#files[@]}" -gt 0 ] || { echo "::error::no tracked shell scripts found"; exit 1; }
        shellcheck "${files[@]}"
        for f in "${held[@]}"; do
          if shellcheck "$f" > /dev/null; then
            echo "::error file=$f::$f has no findings now: remove it from the exclusion"
            exit 1
          fi
        done
      timeout-minutes: 5

  test-typescript-sdk:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble
      env:
        NODE_VERSION: 20

    steps:
    - uses: actions/checkout@v4
    
    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: sdk/ts
      run: npm ci
    
    - name: Build TypeScript SDK
      working-directory: sdk/ts
      run: npm run build
    
    # The build config leaves the tests out and vitest strips types without checking them, so the
    # test files (and the schemas they build) are type-checked here.
    - name: Type-check the SDK with its tests
      working-directory: sdk/ts
      run: npm run typecheck

    - name: Run TypeScript SDK tests
      working-directory: sdk/ts
      run: npm test

  test-ws-loadtest:
    # ws-loadtest is CommonJS and loads the ESM SDK (file: dependency) through a native dynamic
    # import. Pinned to Node 20: no require(esm), the strictest loader it supports.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          sdk/ts/package-lock.json
          Examples/GameDemo/ws-loadtest/package-lock.json

    - name: Install and build TypeScript SDK
      working-directory: sdk/ts
      # npm ci runs the SDK's prepare script, which builds it.
      run: |
        node --version
        npm ci

    - name: Install and build ws-loadtest
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        npm ci
        npm run build

    - name: Run ws-loadtest tests
      working-directory: Examples/GameDemo/ws-loadtest
      run: npm test

    - name: Load the SDK from the compiled CLI
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        node -e '
          const ce = require("./dist/client-events");
          ce.loadFixedPointTypes().then((types) => {
            const payload = ce.payloadGenerators(types).moveTo(ce.eventRandom(42, "MoveTo", "rfixture-room-p5-0-s0"));
            const expected = require("./tests/fixtures/move-to-seed42.json").payloads[0];
            if (JSON.stringify(payload) !== JSON.stringify(expected)) {
              console.error("unexpected payload", JSON.stringify(payload));
              process.exit(1);
            }
            console.log("moveTo payload", JSON.stringify(payload));
          }).catch((error) => { console.error(error); process.exit(1); });
        '
