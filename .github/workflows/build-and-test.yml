# This workflow will build and test Swift project on Linux
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build & Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) take reviewed PRs too; they get the same CI.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'

jobs:
  build:
    name: build (in-turn sync ${{ matrix.in_turn_sync }})
    runs-on: ubuntu-22.04 # Linux runner (matching production environment)
    container:
      image: swift:6.2.4-noble
    strategy:
      fail-fast: false
      matrix:
        # The kill switch: "false" runs the whole suite on the legacy sync path.
        in_turn_sync: ["true", "false"]
    env:
      IN_TURN_SYNC: ${{ matrix.in_turn_sync }}

    steps:
    - uses: actions/checkout@v4

    # Lessons enforced in code (CLAUDE.md § Coding Conventions); the self-test proves the
    # checks still find what they look for before the repository is checked for zero findings.
    - name: Lint lessons
      run: |
        scripts/lint-lessons.sh --self-test
        scripts/lint-lessons.sh

    - name: Clean build artifacts
      run: |
        rm -rf .build
        swift package clean
    
    - name: Show toolchain
      run: swift --version
    
    - name: Build
      run: swift build
    
    - name: Run tests
      run: swift test
      timeout-minutes: 30

    # The wall-clock cadence smoke, in a process of its own: beside the parallel suite, CPU-heavy
    # neighbours can starve it. It fails the job when it didn't run (a renamed suite or test
    # would otherwise match nothing and pass).
    - name: Run wall-clock tests
      shell: bash
      run: |
        set -o pipefail
        WALL_CLOCK_TESTS=1 swift test --skip-build --no-parallel --filter WallClockCadenceSmokeTests 2>&1 | tee wall-clock.log
        if ! grep -q '✔ Test "cadence smoke (wall clock)' wall-clock.log; then
          echo "::error::the wall-clock cadence smoke did not run"
          exit 1
        fi
      timeout-minutes: 5

  # The Examples packages have their own test targets and builds, which the root `swift test`
  # does not cover. One configuration: the GameDemo tests drive keepers without a transport.
  examples:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: deep-research's wire-form tests resolve recorded commits and their parents.
        fetch-depth: 0

    - name: Show toolchain
      run: swift --version

    - name: GameDemo tests
      working-directory: Examples/GameDemo
      run: swift test
      timeout-minutes: 30

    - name: Demo build
      working-directory: Examples/Demo
      run: swift build
      timeout-minutes: 30

    - name: Tracked files unchanged by the tests
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "The Examples tests or builds changed the working tree:"
          echo "$status"
          exit 1
        fi
        # Ignored files too: records written into reevaluation-records/ are gitignored (a local
        # backstop), so the check above would not see a test that writes there again.
        ignored="$(git status --porcelain --ignored -- Examples/GameDemo/reevaluation-records | grep '^!!' || true)"
        if [ -n "$ignored" ]; then
          echo "The Examples tests wrote files into Examples/GameDemo/reevaluation-records/:"
          echo "$ignored"
          exit 1
        fi

    # A change to the schema or to codegen must regenerate its checked-in consumers in the same
    # change: regenerate both examples' schema.json and their WebClient codegen output, and fail
    # on any difference.
    - name: Regenerate example schemas
      run: |
        (cd Examples/Demo && swift run SchemaGen --output schema.json)
        (cd Examples/GameDemo && swift run SchemaGen --output schema.json)
      timeout-minutes: 15

    - name: Install Node.js
      run: |
        apt-get update
        apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version && npm --version

    - name: Regenerate WebClient codegen
      run: |
        npm ci --prefix sdk/ts
        npm run codegen --prefix Examples/Demo/WebClient
        npm run codegen --prefix Examples/GameDemo/WebClient

    - name: Generated files are current
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "::error::Regenerating the example schemas or WebClient codegen changed checked-in files."
          echo "Run, and commit the result:"
          echo "  (cd Examples/Demo && swift run SchemaGen --output schema.json) && (cd Examples/Demo/WebClient && npm run codegen)"
          echo "  (cd Examples/GameDemo && swift run SchemaGen --output schema.json) && (cd Examples/GameDemo/WebClient && npm run codegen)"
          echo "$status"
          git --no-pager diff --stat
          git --no-pager diff | head -200
          exit 1
        fi

    # Every tracked deep-research Python test (standard library, git and node only), each from its
    # own directory. Every file runs; a file fails on a non-zero exit or when its output does not
    # report at least one test run (so a file that runs nothing can't pass). Each failing file is
    # named, and any failure fails the job.
    - name: deep-research Python tests
      shell: bash
      run: |
        apt-get update
        apt-get install -y python3
        python3 --version
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        log="$(mktemp)"
        count=0
        failed=()
        while IFS= read -r -d '' f; do
          count=$((count + 1))
          echo "::group::$f"
          # Actions runs this with `bash -eo pipefail`: capture the status instead of exiting on it.
          rc=0
          (cd "$(dirname "$f")" && python3 "$(basename "$f")") > "$log" 2>&1 || rc=$?
          cat "$log"
          echo "::endgroup::"
          if [ $rc -ne 0 ]; then
            echo "::error file=$f::$f failed (exit $rc)"
            failed+=("$f")
          elif ! grep -qE '^Ran [1-9][0-9]* tests? in ' "$log"; then
            echo "::error file=$f::$f exited 0 but reported no tests run"
            failed+=("$f")
          fi
        done < <(git ls-files -z 'deep-research/*test_*.py' 'deep-research/**/test_*.py')
        if [ $count -eq 0 ]; then
          echo "::error::no deep-research Python tests found"
          exit 1
        fi
        echo "$count deep-research test files run"
        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed deep-research tests:"
          printf '  %s\n' "${failed[@]}"
          exit 1
        fi
      timeout-minutes: 10

  test-typescript-sdk:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.4-noble
      env:
        NODE_VERSION: 20

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      run: |
        apt-get update
        apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version && npm --version
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: sdk/ts
      run: npm ci
    
    - name: Build TypeScript SDK
      working-directory: sdk/ts
      run: npm run build
    
    - name: Run TypeScript SDK tests
      working-directory: sdk/ts
      run: npm test

  test-ws-loadtest:
    # ws-loadtest is CommonJS and loads the ESM SDK (file: dependency) through a native dynamic
    # import. Pinned to Node 20: no require(esm), the strictest loader it supports.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          sdk/ts/package-lock.json
          Examples/GameDemo/ws-loadtest/package-lock.json

    - name: Install and build TypeScript SDK
      working-directory: sdk/ts
      # npm ci runs the SDK's prepare script, which builds it.
      run: |
        node --version
        npm ci

    - name: Install and build ws-loadtest
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        npm ci
        npm run build

    - name: Run ws-loadtest tests
      working-directory: Examples/GameDemo/ws-loadtest
      run: npm test

    - name: Load the SDK from the compiled CLI
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        node -e '
          const ce = require("./dist/client-events");
          ce.loadFixedPointTypes().then((types) => {
            const payload = ce.payloadGenerators(types).moveTo(ce.eventRandom(42, "MoveTo", "rfixture-room-p5-0-s0"));
            const expected = require("./tests/fixtures/move-to-seed42.json").payloads[0];
            if (JSON.stringify(payload) !== JSON.stringify(expected)) {
              console.error("unexpected payload", JSON.stringify(payload));
              process.exit(1);
            }
            console.log("moveTo payload", JSON.stringify(payload));
          }).catch((error) => { console.error(error); process.exit(1); });
        '
