# This workflow will build and test Swift project on Linux
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build & Test

on:
  push:
    # Merges into experiment branches (exp/**) get a run of their own, as main does.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) take reviewed PRs too; they get the same CI.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  # The nightly (nightly.yml) calls this workflow with full_matrix: true. The work the push runs
  # leave out (Notes/plans/2026-11-19-ci-test-audit.md, V1–V5) is kept behind that input.
  workflow_call:
    inputs:
      full_matrix:
        description: Run the variant reruns the push runs leave out
        type: boolean
        default: false

# A new push to a pull request cancels that pull request's run still in progress. Nothing else
# shares a group, so nothing else is ever cancelled: a push (main, exp/**) and every call from the
# nightly (`full_matrix`, whatever event started the nightly) each get a group of their own run.
# That matters even with cancel-in-progress false: GitHub keeps one pending run per group and
# cancels the older pending one. The prefix keeps this workflow's groups apart from
# the other called workflow's in the same nightly run, which shares its run_id.
concurrency:
  group: build-and-test-${{ github.event_name == 'pull_request' && !inputs.full_matrix && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.full_matrix }}

jobs:
  # One debug build of the package and its tests serves every variant: the variants differ only in
  # environment variables read at run time, never at build time, so each is a `swift test
  # --skip-build` run of its own on the same products (Notes/plans/2026-11-19-ci-one-test-build.md).
  # A failed variant lets the next one run; a failed build stops them all, since --skip-build on
  # missing or partial products runs whatever is there. The variables appear only in their test
  # step's env, which the shellcheck job checks (scripts/check-variant-test-selection.sh).
  # The job's limit is above the sum of its steps' own.
  build:
    name: build (variants)
    runs-on: ubuntu-22.04 # Linux runner (matching production environment)
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-

    # Lessons enforced in code (CLAUDE.md § Coding Conventions); the self-test proves the
    # checks still find what they look for before the repository is checked for zero findings.
    - name: Lint lessons
      run: |
        scripts/lint-lessons.sh --self-test
        scripts/lint-lessons.sh

    # The index of Notes/solutions/README.md is generated from each entry's front matter; the
    # self-test proves the check still finds a stale index and a malformed entry first.
    - name: Install python3
      run: scripts/ci-apt-install.sh python3  # the image has no python3 binary; apt retried on mirror errors (#453)

    - name: Check the solutions index
      run: |
        python3 scripts/solutions-index.py --self-test
        python3 scripts/solutions-index.py --check

    # The turn core's rules the compiler can't check (Notes/plans/2026-11-18-swift-state-turns-core.md §7).
    - name: Lint turns
      run: |
        scripts/lint-turns.sh --self-test
        scripts/lint-turns.sh

    # Every test step's log goes through scripts/check-test-run.sh: `swift test` exits 0 when a
    # bundle discovers no tests or a filter matches none (#975). Its self-test proves it still
    # fails a zero-test, a no-match and an empty log, in CRLF and UTF-16 too.
    - name: Test-run check self-test
      run: scripts/check-test-run.sh --self-test

    # Every close of a land's output gate outside a keeper turn notes the failure on the keeper
    # (#704; Notes/plans/2026-11-21-closed-gate-replies-and-pending-failure.md §2.2).
    - name: Gate-close census
      run: |
        scripts/gate-close-census.sh --self-test
        scripts/gate-close-census.sh

    # `swift package clean` only: on a fresh runner there is no .build yet (the build is the next
    # step), so `rm -rf .build` removed nothing.
    - name: Clean build artifacts
      run: swift package clean

    - name: Show toolchain
      run: swift --version

    # The package and its test targets, once. Every `swift test` below passes --skip-build and no
    # other flag, so it runs these products as built.
    - name: Build
      id: build
      run: swift build --build-tests

    # Handler bodies that must not compile (#586): a throw after the write, a wrong response type,
    # validate's context. Each snippet builds as a target of a generated package under .build/.
    - name: Must-not-compile snippets
      run: scripts/check-must-not-compile.sh

    # The whole suite.
    - name: Tests
      id: tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        set -o pipefail
        swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/tests.log" \
          || { echo "::error title=Tests::the tests failed"; exit 1; }
        scripts/check-test-run.sh "$RUNNER_TEMP/tests.log" "Tests"
      timeout-minutes: 30

    # The broadcast diff on the typed sync tables and typed leaf values are on by default. This
    # step runs the tests again with both opted out, so the snapshot-diff fallback keeps coverage
    # until it is removed. On a push it runs only the Transport and NIO targets: the flags reach no
    # other test, which the shellcheck job checks (scripts/check-variant-test-selection.sh: the
    # other targets that reach the transport pin both flags on every config). The nightly runs the
    # whole suite here. In-turn sync is at its default. Row addressing (on by default) keeps the
    # tables on whatever USE_SYNC_TABLES says, and in-process configs don't read ROW_ADDRESSING: a
    # test with rows in effect (a router join with the sync sequence and path hashes) runs the
    # tables here too. The step covers the direct-adapter tests and those without router joins,
    # the sync sequence or path hashes; the fallback under a router join is covered by the tests
    # that turn rows off explicitly (`withRowAddressing(false)`). It fails when the tests that pin
    # the switches didn't run (a renamed target or test would otherwise match nothing and pass).
    # They check the adapter's effective state, not only the environment.
    - name: Tests, sync tables off
      id: sync_tables_off
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        USE_SYNC_TABLES: "false"
        TYPED_LEAF_VALUES: "false"
        FILTER: ${{ !inputs.full_matrix && 'SwiftStateTreeTransportTests\.|SwiftStateTreeNIOTests\.' || '' }}
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/sync-tables-off.log"
        swift test --skip-build ${FILTER:+--filter "$FILTER"} 2>&1 | tee "$log" \
          || { echo "::error title=Tests, sync tables off::the tests failed"; exit 1; }
        for pin in 'A config built with init takes USE_SYNC_TABLES' 'A config built with init takes TYPED_LEAF_VALUES'; do
          if ! grep -q "✔ Test \"$pin" "$log"; then
            echo "::error title=Tests, sync tables off::the test \"$pin\" did not run"
            exit 1
          fi
        done
        scripts/check-test-run.sh "$log" "Tests, sync tables off"
      timeout-minutes: 40

    # Per-player fields on typed per-player tables (#514) are on by default wherever the broadcast
    # tables are. This step runs the Transport and NIO targets again with them opted out, the
    # broadcast tables at their default, so today's per-player snapshot diff keeps coverage. The
    # identity tests toggle the three configurations in process. It fails when the test that pins
    # the switch didn't run.
    - name: Tests, per-player sync tables off
      id: per_player_off
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        PER_PLAYER_SYNC_TABLES: "false"
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/per-player-sync-tables-off.log"
        swift test --skip-build --filter 'SwiftStateTreeTransportTests\.|SwiftStateTreeNIOTests\.' 2>&1 | tee "$log" \
          || { echo "::error title=Tests, per-player sync tables off::the tests failed"; exit 1; }
        pin='A config built with init takes PER_PLAYER_SYNC_TABLES'
        if ! grep -q "✔ Test \"$pin" "$log"; then
          echo "::error title=Tests, per-player sync tables off::the test \"$pin\" did not run"
          exit 1
        fi
        scripts/check-test-run.sh "$log" "Tests, per-player sync tables off"
      timeout-minutes: 40

    # The wall-clock cadence smoke, in a process of its own: beside the parallel suite, CPU-heavy
    # neighbours can starve it. Once: the smoke runs both sync
    # paths itself (`inTurn: [true, false]`). It fails the job when it didn't run (a renamed suite
    # or test would otherwise match nothing and pass).
    - name: Run wall-clock tests
      id: wall_clock
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/wall-clock.log"
        WALL_CLOCK_TESTS=1 swift test --skip-build --no-parallel --filter WallClockCadenceSmokeTests 2>&1 | tee "$log"
        if ! grep -q '✔ Test "cadence smoke (wall clock)' "$log"; then
          echo "::error::the wall-clock cadence smoke did not run"
          exit 1
        fi
        scripts/check-test-run.sh "$log" "Run wall-clock tests"
      timeout-minutes: 5

    # One check stands for every variant, so the run's summary names each one's outcome and its
    # closing line.
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        TESTS_OUTCOME: ${{ steps.tests.outcome }}
        TABLES_OFF_OUTCOME: ${{ steps.sync_tables_off.outcome }}
        PER_PLAYER_OFF_OUTCOME: ${{ steps.per_player_off.outcome }}
        WALL_CLOCK_OUTCOME: ${{ steps.wall_clock.outcome }}
      run: |
        row() {
          local result
          result=$(grep -h 'Test run with' "$RUNNER_TEMP/$3.log" 2>/dev/null | tail -1)
          echo "| $1 | $2 | ${result:-} |"
        }
        {
          echo "| step | outcome | closing line |"
          echo "|---|---|---|"
          echo "| Build | $BUILD_OUTCOME | |"
          row "Tests" "$TESTS_OUTCOME" tests
          row "Tests, sync tables off" "$TABLES_OFF_OUTCOME" sync-tables-off
          row "Tests, per-player sync tables off" "$PER_PLAYER_OFF_OUTCOME" per-player-sync-tables-off
          row "Run wall-clock tests" "$WALL_CLOCK_OUTCOME" wall-clock
        } >> "$GITHUB_STEP_SUMMARY"

  # The turn core in release (its debug run is the build job's `swift test`): the ordered,
  # model and runtime-stop checks, and the step path's specialization for a client's machine.
  # Also the keeper and transport tests in release.
  turns-release:
    name: release (turns, keeper, transport)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache, as in the build job: keyed by the image digest and the tracked
    # Package.resolved files. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-

    - name: Show toolchain
      run: swift --version

    - name: Run the turn core's tests in release
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/turns-release.log"
        swift test -c release --filter "SwiftStateTurnsTests|SwiftStateTurnsMacrosTests" 2>&1 | tee "$log"
        scripts/check-test-run.sh "$log" "Run the turn core's tests in release"
      timeout-minutes: 40

    # Catches tests that read DEBUG-only probes (#748), and shows that release registration
    # runs the value walks (RegistrationValueWalkTests, SyncRegistrationTests), and that the
    # keeper's debug-only fields are absent in release (KeeperCensusTests).
    - name: Run the keeper, transport and registration tests in release
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/keeper-release.log"
        swift test -c release --filter "LandKeeper|KeeperCensus|Transport|RegistrationValueWalk|SyncRegistration" 2>&1 | tee "$log"
        scripts/check-test-run.sh "$log" "Run the keeper, transport and registration tests in release"
      timeout-minutes: 40

    # Nightly only: the same tests in release with the turn core's runtime exclusivity checks
    # back on (TURNS_EXCLUSIVITY_CHECKED lifts `@exclusivity(unchecked)` on its stored state,
    # #624), so an overlapping access the unchecked build would let through traps here.
    - name: Run the turn core's tests in release with exclusivity checked
      if: ${{ inputs.full_matrix }}
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/turns-release-exclusivity.log"
        swift test -c release -Xswiftc -DTURNS_EXCLUSIVITY_CHECKED --filter "SwiftStateTurnsTests|SwiftStateTurnsMacrosTests" 2>&1 | tee "$log"
        scripts/check-test-run.sh "$log" "Run the turn core's tests in release with exclusivity checked"
      timeout-minutes: 40

    - name: Check the step path's specialization
      run: scripts/check-turns-inlinable.sh

  # The Examples packages have their own test targets and builds, which the root `swift test`
  # does not cover. One configuration: the GameDemo tests drive keepers without a transport.
  # The Demo tests pin its lands' sync table fallback lists.
  examples:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-

    - name: Show toolchain
      run: swift --version

    - name: GameDemo tests
      working-directory: Examples/GameDemo
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/gamedemo-tests.log"
        swift test 2>&1 | tee "$log"
        "$GITHUB_WORKSPACE/scripts/check-test-run.sh" "$log" "GameDemo tests"
      timeout-minutes: 30

    # The GameDemo pacing tests that bound wall-clock time, in a process of their own (#466):
    # beside the parallel suite, another test's subprocess delays their wakes. It fails the job
    # when they didn't run (a renamed suite would otherwise match nothing and pass). The log goes
    # to the runner's temp directory: the working tree must stay unchanged.
    - name: GameDemo wall-clock tests
      working-directory: Examples/GameDemo
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/gamedemo-wall-clock.log"
        WALL_CLOCK_TESTS=1 swift test --skip-build --no-parallel --filter LoadTestPacingWallClockTests 2>&1 | tee "$log"
        if ! grep -q '✔ Suite "LoadTestPacing (wall clock)" passed' "$log"; then
          echo "::error::the GameDemo wall-clock tests did not run"
          exit 1
        fi
        "$GITHUB_WORKSPACE/scripts/check-test-run.sh" "$log" "GameDemo wall-clock tests"
      timeout-minutes: 5

    - name: Demo build
      working-directory: Examples/Demo
      run: swift build
      timeout-minutes: 30

    - name: Demo tests
      working-directory: Examples/Demo
      shell: bash
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/demo-tests.log"
        swift test 2>&1 | tee "$log"
        "$GITHUB_WORKSPACE/scripts/check-test-run.sh" "$log" "Demo tests"
      timeout-minutes: 20

    - name: Tracked files unchanged by the tests
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "The Examples tests or builds changed the working tree:"
          echo "$status"
          exit 1
        fi
        # Ignored files too: records written into reevaluation-records/ are gitignored (a local
        # backstop), so the check above would not see a test that writes there again.
        ignored="$(git status --porcelain --ignored -- Examples/GameDemo/reevaluation-records | grep '^!!' || true)"
        if [ -n "$ignored" ]; then
          echo "The Examples tests wrote files into Examples/GameDemo/reevaluation-records/:"
          echo "$ignored"
          exit 1
        fi

    # A change to the schema or to codegen must regenerate its checked-in consumers in the same
    # change: regenerate both examples' schema.json and their WebClient codegen output, and fail
    # on any difference.
    - name: Regenerate example schemas
      run: |
        (cd Examples/Demo && swift run SchemaGen --output schema.json)
        (cd Examples/GameDemo && swift run SchemaGen --output schema.json)
      timeout-minutes: 15

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Regenerate WebClient codegen
      run: |
        npm ci --prefix sdk/ts
        npm run codegen --prefix Examples/Demo/WebClient
        npm run codegen --prefix Examples/GameDemo/WebClient

    - name: Generated files are current
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "::error::Regenerating the example schemas or WebClient codegen changed checked-in files."
          echo "Run, and commit the result:"
          echo "  (cd Examples/Demo && swift run SchemaGen --output schema.json) && (cd Examples/Demo/WebClient && npm run codegen)"
          echo "  (cd Examples/GameDemo && swift run SchemaGen --output schema.json) && (cd Examples/GameDemo/WebClient && npm run codegen)"
          echo "$status"
          git --no-pager diff --stat
          git --no-pager diff | sed -n 1,200p
          exit 1
        fi

    # EncodingBenchmark's --join-through-router / --row-addressing: the refused combinations exit 2
    # with their reason (row-specific ones only for an explicit `on`), and small router runs (rows
    # by default, on and off) join every session and record perConnection bytes and whether row
    # entries were in effect. Reuses the tests' debug build.
    # The router check parses the benchmark's JSON with python3, which the image doesn't have.
    - name: Install python3
      run: scripts/ci-apt-install.sh python3  # apt retried on mirror errors (#453)
      timeout-minutes: 26  # above ci-apt-install.sh's worst case, 24 min 20 s (#659)

    - name: EncodingBenchmark router flags
      working-directory: Examples/GameDemo
      shell: bash
      run: scripts/check-encoding-benchmark-router.sh
      timeout-minutes: 10

  # The deep-research Python tests, in a job of their own: they need no Swift build, so they run
  # beside the Swift jobs instead of after the examples job's builds. On the runner itself, not
  # in the Swift image: the tests need no Swift build and no particular Swift version, only
  # Python, git and Node, and the image has no python3 binary. Python 3.12 and Node 20 come
  # from official builds, so the job doesn't depend on the Ubuntu mirrors (#453, #635); the
  # full history.
  deep-research-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: deep-research's wire-form tests resolve recorded commits and their parents.
        fetch-depth: 0

    # Python 3.12, the version the Swift image's apt gave this job before (3.12.3), from the
    # official builds: a slow archive.ubuntu.com used up the test step's budget (#635).
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Every tracked deep-research Python test (standard library, git and node only), each from its
    # own directory. Every file runs; a file fails on a non-zero exit or when its output does not
    # report at least one test run (so a file that runs nothing can't pass). Any failure fails the
    # job. Each file has its own bound (#484): a file that hangs is stopped with SIGABRT, which
    # `-X faulthandler` answers with every thread's stack, then named as timed out, and the loop
    # goes on. Every failing file is named while the hangs fit in the step's cap (two of them, see
    # file_timeout); past that, the step's own timeout cancels the files still to run.
    - name: deep-research Python tests
      shell: bash
      run: |
        python3 --version
        log="$(mktemp)"
        # Per file, about 3x the slowest file on the runner (network-impairment-2026-11/test_topic.py,
        # 96 s on main at 1075c23c). The files take 2 to 4 min together, so the step's 15 minutes
        # hold two hangs (2 x 310 s) plus the rest; more than that still ends at the step's cap.
        file_timeout=300
        count=0
        failed=()
        summary=()
        while IFS= read -r -d '' f; do
          count=$((count + 1))
          echo "::group::$f"
          # Actions runs this with `bash -eo pipefail`: capture the status instead of exiting on it.
          rc=0
          (cd "$(dirname "$f")" && timeout --verbose -s ABRT -k 10 "$file_timeout" python3 -X faulthandler "$(basename "$f")") > "$log" 2>&1 || rc=$?
          cat "$log"
          echo "::endgroup::"
          # `--verbose` logs each signal timeout sends, so a test's own exit 124 or 137 isn't read
          # as the bound. Unanchored: unittest writes its dots and "test_x ... " to stderr without a
          # newline, so after a hang mid-test timeout's line follows them on the same line.
          if grep -q 'timeout: sending signal KILL to command' "$log"; then
            # KILL comes 10 s after an ABRT the process outlived, so the log may hold no stack.
            echo "::error file=$f::$f timed out after ${file_timeout} s and was killed 10 s later (exit $rc); its log group holds Python's stack only if the SIGABRT reached faulthandler"
            failed+=("$f")
          elif grep -q 'timeout: sending signal ABRT to command' "$log"; then
            echo "::error file=$f::$f timed out after ${file_timeout} s (exit $rc); its log group holds Python's stack if faulthandler got the SIGABRT"
            failed+=("$f")
          elif [ $rc -ne 0 ]; then
            echo "::error file=$f::$f failed (exit $rc)"
            failed+=("$f")
          elif ! grep -qE '^Ran [1-9][0-9]* tests? in ' "$log"; then
            echo "::error file=$f::$f exited 0 but reported no tests run"
            failed+=("$f")
          fi
          # `|| true`: a file with no such line is already in the failed list; keep going.
          ran="$(grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -1 || true)"
          # unittest's summary: the first OK/FAILED line after the last "Ran N tests" line, not a
          # test's own output that happens to start with OK.
          result="$(awk '/^Ran [0-9]+ tests? in /{r=NR; line=""} r && NR>r && line=="" && /^(OK|FAILED)( |$)/{line=$0} END{print line}' "$log")"
          summary+=("$f: ${ran% in *}, ${result:-no result line}")
        done < <(git ls-files -z 'deep-research/*test_*.py' 'deep-research/**/test_*.py')
        if [ $count -eq 0 ]; then
          echo "::error::no deep-research Python tests found"
          exit 1
        fi
        printf '%s\n' "${summary[@]}"
        echo "$count deep-research test files run"
        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed deep-research tests:"
          printf '  %s\n' "${failed[@]}"
          exit 1
        fi
      timeout-minutes: 15

    # The golden-change classes, #700 K1a's recordPayload included, on fixtures: here because
    # this job has Python and the Swift image doesn't. The tool reads goldens only when a change
    # moves them; its self-test runs on every push.
    - name: Classify golden changes self-test
      run: python3 scripts/classify-golden-changes.py --self-test
      timeout-minutes: 2

  # No new wall-clock polls in the tests (#457): counts above scripts/wall-clock-baseline.txt
  # fail, and so do counts below it until it is lowered. On a pull request, a count raised over
  # the base branch's baseline prints `BASELINE RAISED` and a warning; the PR states the reason.
  wall-clock-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Wall-clock polls in tests
      shell: bash
      run: |
        scripts/lint-wall-clock-tests.sh --self-test
        base=()
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:scripts/wall-clock-baseline.txt > "$RUNNER_TEMP/base-baseline.txt" 2>/dev/null \
            || : > "$RUNNER_TEMP/base-baseline.txt"
          base=(--base-baseline "$RUNNER_TEMP/base-baseline.txt")
        fi
        scripts/lint-wall-clock-tests.sh "${base[@]}"
      timeout-minutes: 5

  # Every tracked shell script passes ShellCheck (options in .shellcheckrc). A finding is fixed, or
  # disabled on its line with the reason beside it. The pinned release is checked against its hash.
  shellcheck:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    # The nightly's gate and report, against a stub gh. The report only runs on scheduled runs,
    # so nothing else would try it before a red main needs it.
    - name: Nightly scripts
      run: scripts/test-nightly-scripts.sh
      timeout-minutes: 2

    # The apt helper's retries, against a stub apt-get that fails or hangs (#659).
    - name: apt helper
      run: scripts/test-ci-apt-install.sh
      timeout-minutes: 3

    # The Swift image pin check (one digest for every Swift container image and Dockerfile FROM
    # line) runs in image-pin.yml, which this workflow's paths-ignore (.devcontainer/**) can't skip.

    # The build job runs its variants on one build, which is valid only while no variable is read at
    # build time: each appears only in its test step's env, and Package.swift reads no environment.
    # Its sync-tables-off step runs only the Transport and NIO targets, which is safe only while no
    # other test can read USE_SYNC_TABLES or TYPED_LEAF_VALUES. Here, not in that job: the check is
    # Python, which the Swift image lacks, and the runner's own Swift only parses the manifest
    # (`swift package dump-package`) for the test targets' dependencies.
    - name: The variant runs left out can't read their variable
      run: |
        swift --version
        scripts/check-variant-test-selection.sh --self-test
        scripts/check-variant-test-selection.sh

    - name: Install ShellCheck 0.11.0
      run: |
        curl -sSfL --retry 3 --retry-all-errors -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
        echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
        tar -xJf /tmp/shellcheck.tar.xz -C /tmp
        sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
        shellcheck --version

    # The topic run scripts below are excluded until their topics' data is recorded (a change there
    # moves the measured commit); their findings are tracked in #316. An excluded script that
    # passes fails the step, so the exclusion is dropped with the fix.
    - name: ShellCheck every tracked script
      shell: bash
      run: |
        excluded='^deep-research/(entity-delta-baseline|multiroom-load-2026-11|network-impairment-2026-11|single-room-entity-scaling|snapshot-baseline|visibility)/run\.sh$'
        mapfile -d '' files < <(git ls-files -z '*.sh' '*.bash' | grep -zvE "$excluded")
        mapfile -d '' held < <(git ls-files -z '*.sh' '*.bash' | grep -zE "$excluded")
        echo "ShellCheck on ${#files[@]} scripts (${#held[@]} excluded)"
        [ "${#files[@]}" -gt 0 ] || { echo "::error::no tracked shell scripts found"; exit 1; }
        shellcheck "${files[@]}"
        for f in "${held[@]}"; do
          if shellcheck "$f" > /dev/null; then
            echo "::error file=$f::$f has no findings now: remove it from the exclusion"
            exit 1
          fi
        done
      timeout-minutes: 5

  test-typescript-sdk:
    runs-on: ubuntu-22.04
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
      env:
        NODE_VERSION: 20

    steps:
    - uses: actions/checkout@v4
    
    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: sdk/ts
      run: npm ci
    
    - name: Build TypeScript SDK
      working-directory: sdk/ts
      run: npm run build
    
    # The build config leaves the tests out and vitest strips types without checking them, so the
    # test files (and the schemas they build) are type-checked here.
    - name: Type-check the SDK with its tests
      working-directory: sdk/ts
      run: npm run typecheck

    - name: Run TypeScript SDK tests
      working-directory: sdk/ts
      run: npm test

  test-ws-loadtest:
    # ws-loadtest is CommonJS and loads the ESM SDK (file: dependency) through a native dynamic
    # import. Pinned to Node 20: no require(esm), the strictest loader it supports.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          sdk/ts/package-lock.json
          Examples/GameDemo/ws-loadtest/package-lock.json

    - name: Install and build TypeScript SDK
      working-directory: sdk/ts
      # npm ci runs the SDK's prepare script, which builds it.
      run: |
        node --version
        npm ci

    - name: Install and build ws-loadtest
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        npm ci
        npm run build

    - name: Run ws-loadtest tests
      working-directory: Examples/GameDemo/ws-loadtest
      run: npm test

    - name: Load the SDK from the compiled CLI
      working-directory: Examples/GameDemo/ws-loadtest
      run: |
        node -e '
          const ce = require("./dist/client-events");
          ce.loadFixedPointTypes().then((types) => {
            const payload = ce.payloadGenerators(types).moveTo(ce.eventRandom(42, "MoveTo", "rfixture-room-p5-0-s0"));
            const expected = require("./tests/fixtures/move-to-seed42.json").payloads[0];
            if (JSON.stringify(payload) !== JSON.stringify(expected)) {
              console.error("unexpected payload", JSON.stringify(payload));
              process.exit(1);
            }
            console.log("moveTo payload", JSON.stringify(payload));
          }).catch((error) => { console.error(error); process.exit(1); });
        '

  # The full suite on macOS, next to the Linux build job's: same triggers and path filters, since it
  # lives in this workflow. Not a required check: it is not listed in branch protection, so a red
  # run shows on the PR without blocking the merge, and it stays red-visible (continue-on-error would
  # report success). The nightly's call skips it (full_matrix), because that run is about the Linux
  # variant reruns and a red macOS job would fail the nightly (#846).
  # No runner image has Swift 6.4: 6.4.x ships with Xcode 27, and the images stop at Xcode 26.x
  # (macos-26: 26.6). So the job installs the swift.org 6.4.3 toolchain, pinned by SHA-256, and puts
  # it first on PATH. The SHA-256 is the guarantee: the download is the one file whose hash is
  # pinned here. There is no signature check on top, because `pkgutil --check-signature` passes any
  # valid Developer ID signature, so it would not say whose package this is. A failed run keeps
  # its test log as an artifact (3 days), since nobody can rerun a red macOS job locally.
  macos:
    name: macos (6.4.3)
    if: ${{ !inputs.full_matrix }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SWIFT_PKG_URL: https://download.swift.org/swift-6.4.3-release/xcode/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-osx.pkg
      SWIFT_PKG_SHA256: ccbfc46b166625613286abfa63b6e974b5b6a7c2205e5bc9e52d09f6e051e859

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install the Swift 6.4.3 toolchain
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/swift.pkg" "$SWIFT_PKG_URL"
        echo "$SWIFT_PKG_SHA256  $RUNNER_TEMP/swift.pkg" | shasum -a 256 -c -
        sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
        echo "/Library/Developer/Toolchains/swift-6.4.3-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"

    - name: Show toolchain
      run: |
        swift --version
        xcodebuild -version
        sw_vers

    - name: Build
      run: swift build --build-tests

    - name: Tests
      shell: bash
      run: |
        set -o pipefail
        swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/tests.log" \
          || { echo "::error title=Tests::the tests failed"; exit 1; }
        scripts/check-test-run.sh "$RUNNER_TEMP/tests.log" "Tests"
      timeout-minutes: 60

    - name: Keep the test log
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: macos-tests-log
        path: ${{ runner.temp }}/tests.log
        retention-days: 3
        if-no-files-found: ignore
