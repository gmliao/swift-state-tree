name: E2E Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) take reviewed PRs too; they get the same CI.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  workflow_dispatch: # Allow manual triggering

jobs:
  e2e-tests:
    # A hung step fails the job instead of running until the 6 h limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # Linux runner (production target)
    container:
      image: swift:6.2.4-noble
    env:
      # assertConverged (#79): DemoServer mounts the debug state routes, the CLI sends the admin key.
      ENABLE_DEBUG_STATE_ROUTES: "true"
      E2E_ADMIN_KEY: demo-admin-key
      # A convergence mismatch fails the run (the CLI default is report-only).
      E2E_CONVERGENCE_GATING: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      run: |
        apt-get update
        apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version && npm --version
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build SDK (required by CLI)
      working-directory: sdk/ts
      run: |
        npm ci
        npm run build

    - name: Install CLI dependencies
      working-directory: Tools/CLI
      run: npm ci

    - name: Build CLI
      working-directory: Tools/CLI
      run: npm run build

    - name: CLI unit tests
      working-directory: Tools/CLI
      run: npm run test:cli:unit

    - name: Build DemoServer
      working-directory: Examples/Demo
      run: swift build

    # Test jsonObject encoding
    - name: Start DemoServer (jsonObject)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: json
      run: |
        swift run DemoServer > /tmp/demoserver-json.log 2>&1 &
        echo $! > /tmp/demoserver-json.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-json.pid) using encoding: json"

    - name: Wait for DemoServer (jsonObject)
      run: |
        echo "Waiting for DemoServer (jsonObject) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (jsonObject) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (jsonObject) failed to start within $timeout seconds"
        cat /tmp/demoserver-json.log
        exit 1

    - name: Run E2E tests (jsonObject)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: json
      run: npm run test:e2e:jsonObject

    - name: Stop DemoServer (jsonObject)
      if: always()
      run: |
        if [ -f /tmp/demoserver-json.pid ]; then
          kill $(cat /tmp/demoserver-json.pid) || true
          wait $(cat /tmp/demoserver-json.pid) 2>/dev/null || true
        fi
        sleep 2 # Give port time to release

    # Test opcodeJsonArray encoding
    - name: Start DemoServer (opcodeJsonArray)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: jsonOpcode
      run: |
        swift run DemoServer > /tmp/demoserver-jsonopcode.log 2>&1 &
        echo $! > /tmp/demoserver-jsonopcode.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-jsonopcode.pid) using encoding: jsonOpcode"

    - name: Wait for DemoServer (opcodeJsonArray)
      run: |
        echo "Waiting for DemoServer (opcodeJsonArray) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (opcodeJsonArray) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (opcodeJsonArray) failed to start within $timeout seconds"
        cat /tmp/demoserver-jsonopcode.log
        exit 1

    - name: Run E2E tests (opcodeJsonArray)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: jsonOpcode
      run: npm run test:e2e:opcodeJsonArray

    - name: Stop DemoServer (opcodeJsonArray)
      if: always()
      run: |
        if [ -f /tmp/demoserver-jsonopcode.pid ]; then
          kill $(cat /tmp/demoserver-jsonopcode.pid) || true
          wait $(cat /tmp/demoserver-jsonopcode.pid) 2>/dev/null || true
        fi
        sleep 2 # Give port time to release

    # Test messagepack encoding
    - name: Start DemoServer (messagepack)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: messagepack
      run: |
        swift run DemoServer > /tmp/demoserver-messagepack.log 2>&1 &
        echo $! > /tmp/demoserver-messagepack.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-messagepack.pid) using encoding: messagepack"

    - name: Wait for DemoServer (messagepack)
      run: |
        echo "Waiting for DemoServer (messagepack) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (messagepack) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (messagepack) failed to start within $timeout seconds"
        cat /tmp/demoserver-messagepack.log
        exit 1

    - name: Run E2E tests (messagepack)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: messagepack
      run: npm run test:e2e:messagepack

    - name: Stop DemoServer (messagepack)
      if: always()
      run: |
        if [ -f /tmp/demoserver-messagepack.pid ]; then
          kill $(cat /tmp/demoserver-messagepack.pid) || true
          wait $(cat /tmp/demoserver-messagepack.pid) 2>/dev/null || true
        fi

    - name: Show DemoServer logs on failure
      # Also after a step timeout or a cancel, which do not count as failure().
      if: failure() || cancelled()
      run: |
        echo "=== DemoServer logs ==="
        for log in /tmp/demoserver-*.log; do
          if [ -f "$log" ]; then
            echo "--- $(basename $log) ---"
            cat "$log"
            echo ""
          fi
        done

  e2e-game-tests:
    name: e2e-game-tests (in-turn sync ${{ matrix.in_turn_sync }})
    # A hung step fails the job instead of running until the 6 h limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # Linux runner (production target)
    container:
      image: swift:6.2.4-noble
    strategy:
      fail-fast: false
      matrix:
        # The kill switch: "false" runs GameServer on the legacy sync path.
        in_turn_sync: ["true", "false"]
    env:
      IN_TURN_SYNC: ${{ matrix.in_turn_sync }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      run: |
        apt-get update
        apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version && npm --version

    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Run GameServer E2E tests (includes shape invariants)
      run: |
        cd Tools/CLI
        ./test-e2e-game.sh

  e2e-matchmaking-tests:
    # Temporarily disabled while paper work takes priority (job was hanging until
    # run cancellation, e.g. run 33290172486). Remove this `if` to re-enable.
    if: false
    # A hung step fails the job instead of running until the 6 h limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # Linux runner (production target)
    container:
      image: swift:6.2.4-noble
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js and lsof
      run: |
        apt-get update
        apt-get install -y curl lsof
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version && npm --version

    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json', 'Packages/control-plane/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build SDK (required by CLI)
      working-directory: sdk/ts
      run: |
        npm ci
        npm run build

    - name: Install CLI dependencies
      working-directory: Tools/CLI
      run: npm ci

    - name: Build matchmaking control plane
      working-directory: Packages/control-plane
      run: |
        npm ci
        npm run build

    - name: Build GameServer
      run: swift build --package-path Examples/GameDemo

    - name: Run Matchmaking E2E (control plane + GameServer, no nginx)
      env:
        REDIS_HOST: redis  # Service hostname when job runs in container
        MATCHMAKING_MIN_WAIT_MS: "0"  # Allow immediate match in CI (no periodic tick)
      run: |
        bash Tools/CLI/scripts/internal/run-matchmaking-full-with-test.sh

    - name: Run Matchmaking MVP All Encodings (jsonObject, opcodeJsonArray, messagepack)
      env:
        REDIS_HOST: redis
        MATCHMAKING_MIN_WAIT_MS: "0"
      run: |
        bash Tools/CLI/scripts/internal/run-matchmaking-full-encodings.sh
