name: E2E Tests

on:
  push:
    # Merges into experiment branches (exp/**) get a run of their own, as main does.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) take reviewed PRs too; they get the same CI.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  workflow_dispatch: # Allow manual triggering
  # The nightly (nightly.yml) calls this workflow with full_matrix: true. The work the push runs
  # leave out (Notes/plans/2026-11-19-ci-test-audit.md, V1–V5) is kept behind that input.
  workflow_call:
    inputs:
      full_matrix:
        description: Run the variant reruns the push runs leave out
        type: boolean
        default: false

# A new push to a pull request cancels that pull request's run still in progress. Nothing else
# shares a group, so nothing else is ever cancelled: a push (main, exp/**), a workflow_dispatch and
# every call from the nightly (`full_matrix`, whatever event started the nightly) each get a group
# of their own run. That matters even with cancel-in-progress false: GitHub keeps one pending run
# per group and cancels the older pending one. The prefix keeps this workflow's groups apart from
# the other called workflow's in the same nightly run, which shares its run_id.
concurrency:
  group: e2e-tests-${{ github.event_name == 'pull_request' && !inputs.full_matrix && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.full_matrix }}

jobs:
  e2e-tests:
    # A hung step fails the job instead of running until the 6 h limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # Linux runner (production target)
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    env:
      # assertConverged (#79): DemoServer mounts the debug state routes, the CLI sends the admin key.
      ENABLE_DEBUG_STATE_ROUTES: "true"
      E2E_ADMIN_KEY: demo-admin-key
      # A convergence mismatch fails the run (the CLI default is report-only).
      E2E_CONVERGENCE_GATING: "true"

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-

    # curl for the server readiness checks; apt retried on mirror errors (#453).
    - name: Install curl
      run: scripts/ci-apt-install.sh curl
      timeout-minutes: 26  # above ci-apt-install.sh's worst case, 24 min 20 s (#659)

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build SDK (required by CLI)
      working-directory: sdk/ts
      run: |
        npm ci
        npm run build

    - name: Install CLI dependencies
      working-directory: Tools/CLI
      run: npm ci

    - name: Build CLI
      working-directory: Tools/CLI
      run: npm run build

    - name: CLI unit tests
      working-directory: Tools/CLI
      run: npm run test:cli:unit

    - name: Build DemoServer
      working-directory: Examples/Demo
      run: swift build

    # Test jsonObject encoding
    - name: Start DemoServer (jsonObject)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: json
      run: |
        swift run DemoServer > /tmp/demoserver-json.log 2>&1 &
        echo $! > /tmp/demoserver-json.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-json.pid) using encoding: json"

    - name: Wait for DemoServer (jsonObject)
      run: |
        echo "Waiting for DemoServer (jsonObject) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (jsonObject) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (jsonObject) failed to start within $timeout seconds"
        cat /tmp/demoserver-json.log
        exit 1

    - name: Run E2E tests (jsonObject)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: json
      run: npm run test:e2e:jsonObject

    - name: Stop DemoServer (jsonObject)
      if: always()
      run: |
        if [ -f /tmp/demoserver-json.pid ]; then
          kill $(cat /tmp/demoserver-json.pid) || true
          wait $(cat /tmp/demoserver-json.pid) 2>/dev/null || true
        fi
        sleep 2 # Give port time to release

    # Test opcodeJsonArray encoding
    - name: Start DemoServer (opcodeJsonArray)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: jsonOpcode
      run: |
        swift run DemoServer > /tmp/demoserver-jsonopcode.log 2>&1 &
        echo $! > /tmp/demoserver-jsonopcode.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-jsonopcode.pid) using encoding: jsonOpcode"

    - name: Wait for DemoServer (opcodeJsonArray)
      run: |
        echo "Waiting for DemoServer (opcodeJsonArray) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (opcodeJsonArray) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (opcodeJsonArray) failed to start within $timeout seconds"
        cat /tmp/demoserver-jsonopcode.log
        exit 1

    - name: Run E2E tests (opcodeJsonArray)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: jsonOpcode
      run: npm run test:e2e:opcodeJsonArray

    - name: Stop DemoServer (opcodeJsonArray)
      if: always()
      run: |
        if [ -f /tmp/demoserver-jsonopcode.pid ]; then
          kill $(cat /tmp/demoserver-jsonopcode.pid) || true
          wait $(cat /tmp/demoserver-jsonopcode.pid) 2>/dev/null || true
        fi
        sleep 2 # Give port time to release

    # Test opcode encoding (#543): opcode JSON messages with payload compression on, the only
    # leg that runs the opcode JSON message encoder's positional path (#541).
    - name: Start DemoServer (opcode)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: opcode
      run: |
        swift run DemoServer > /tmp/demoserver-opcode.log 2>&1 &
        echo $! > /tmp/demoserver-opcode.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-opcode.pid) using encoding: opcode"

    - name: Wait for DemoServer (opcode)
      run: |
        echo "Waiting for DemoServer (opcode) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (opcode) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (opcode) failed to start within $timeout seconds"
        cat /tmp/demoserver-opcode.log
        exit 1

    - name: Run E2E tests (opcode)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: opcode
      run: npm run test:e2e:opcode

    - name: Stop DemoServer (opcode)
      if: always()
      run: |
        if [ -f /tmp/demoserver-opcode.pid ]; then
          kill $(cat /tmp/demoserver-opcode.pid) || true
          wait $(cat /tmp/demoserver-opcode.pid) 2>/dev/null || true
        fi
        sleep 2 # Give port time to release

    # Test messagepack encoding
    - name: Start DemoServer (messagepack)
      working-directory: Examples/Demo
      env:
        TRANSPORT_ENCODING: messagepack
      run: |
        swift run DemoServer > /tmp/demoserver-messagepack.log 2>&1 &
        echo $! > /tmp/demoserver-messagepack.pid
        echo "DemoServer started with PID $(cat /tmp/demoserver-messagepack.pid) using encoding: messagepack"

    - name: Wait for DemoServer (messagepack)
      run: |
        echo "Waiting for DemoServer (messagepack) to start..."
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8080/schema > /dev/null 2>&1; then
            echo "✅ DemoServer (messagepack) is ready!"
            exit 0
          fi
          echo "Waiting... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "❌ DemoServer (messagepack) failed to start within $timeout seconds"
        cat /tmp/demoserver-messagepack.log
        exit 1

    - name: Run E2E tests (messagepack)
      timeout-minutes: 10
      working-directory: Tools/CLI
      env:
        TRANSPORT_ENCODING: messagepack
      run: npm run test:e2e:messagepack

    - name: Stop DemoServer (messagepack)
      if: always()
      run: |
        if [ -f /tmp/demoserver-messagepack.pid ]; then
          kill $(cat /tmp/demoserver-messagepack.pid) || true
          wait $(cat /tmp/demoserver-messagepack.pid) 2>/dev/null || true
        fi

    - name: Show DemoServer logs on failure
      # Also after a step timeout or a cancel, which do not count as failure().
      if: failure() || cancelled()
      run: |
        echo "=== DemoServer logs ==="
        for log in /tmp/demoserver-*.log; do
          if [ -f "$log" ]; then
            echo "--- $(basename $log) ---"
            cat "$log"
            echo ""
          fi
        done

  e2e-game-tests:
    name: e2e-game-tests (row addressing ${{ matrix.row_addressing }})
    # A hung step fails the job instead of running until the 6 h limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # Linux runner (production target)
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    strategy:
      fail-fast: false
      matrix:
        # The default ("on") and the opt-out ("off") run as legs of their own, side by side: the
        # opt-out run no longer waits for the default one, and runs when the default one fails.
        row_addressing: ["on", "off"]

    steps:
    - uses: actions/checkout@v4

    # SwiftPM's shared cache (its clones of the pinned dependencies and the prebuilts it downloads),
    # under the container's $HOME (/github/home). Keyed by the image digest and the tracked
    # Package.resolved files, named one by one: the post step evaluates the key again, and a '**'
    # glob then walks .build and fails. actions/cache saves in its post step only when the job
    # succeeded and the key wasn't an exact hit. .build is not cached.
    - name: SwiftPM shared cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/org.swift.swiftpm
        key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-${{ hashFiles('Package.resolved', 'Examples/*/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a-

    # curl for the server readiness checks; apt retried on mirror errors (#453).
    - name: Install curl
      run: scripts/ci-apt-install.sh curl
      timeout-minutes: 26  # above ci-apt-install.sh's worst case, 24 min 20 s (#659)

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    # The default path: row addressing is on by default, so in the opcode encodings it is in
    # effect. The check (check-row-addressing-run.sh), per encoding: in the
    # opcode encodings every join negotiated rowAddressing and the live scenarios applied
    # row-derived patches; in json (row entries need an opcode encoding) no join negotiated it and
    # no row patch was applied. In every encoding the SDK's strict close (4013) never fired and no
    # land fell back to today's entries.
    - name: Run GameServer E2E tests (includes shape invariants)
      if: matrix.row_addressing == 'on'
      shell: bash
      env:
        E2E_ENCODINGS: json jsonOpcode opcode messagepack
        # Its own log directory: the logs the check reads are this step's runs only.
        E2E_TMP_DIR: /tmp/e2e-main
      run: |
        set -o pipefail
        cd Tools/CLI
        ./test-e2e-game.sh 2>&1 | tee /tmp/e2e-main.out
        ./check-row-addressing-run.sh /tmp/e2e-main.out /tmp/e2e-main $E2E_ENCODINGS

    # The opt-out (ROW_ADDRESSING=false), in the opcode encodings:
    # today's entries keep an E2E run while the old forms stay. This step also runs the
    # tables-off variant (USE_SYNC_TABLES=false TYPED_LEAF_VALUES=false), the snapshot-diff
    # fallback, which is an opt-out only with row addressing off. No join negotiates rowAddressing (--expect-off).
    # json only with full_matrix (the nightly): json has no opcode state updates, so row
    # addressing is never in effect for it (`TransportEncodingConfig.effective`) and its run here
    # is the row-on leg's json run (audit plan, V1).
    - name: Run GameServer E2E tests with row addressing off (opt-out)
      if: matrix.row_addressing == 'off'
      shell: bash
      env:
        ROW_ADDRESSING: "false"
        E2E_ENCODINGS: ${{ inputs.full_matrix && 'json jsonOpcode opcode messagepack' || 'jsonOpcode opcode messagepack' }}
        E2E_TMP_DIR: /tmp/e2e-rows-off
      run: |
        set -o pipefail
        cd Tools/CLI
        ./test-e2e-game.sh 2>&1 | tee /tmp/e2e-rows-off.out
        ./check-row-addressing-run.sh --expect-off /tmp/e2e-rows-off.out /tmp/e2e-rows-off $E2E_ENCODINGS

    # Each server run's effective config, from the adapter's per-land log line, so two legs can be
    # compared on one commit. It checks nothing.
    - name: Effective transport config per run
      if: always()
      shell: bash
      run: |
        for dir in /tmp/e2e-main /tmp/e2e-rows-off; do
          if [ -d "$dir" ]; then
            echo "== $dir"
            Tools/CLI/summarize-effective-config.sh "$dir"
          fi
        done

  e2e-matchmaking-tests:
    # Temporarily disabled: the job hung until the run was cancelled (e.g. run 33290172486).
    # Re-enable by removing this `if` once the hang is diagnosed and fixed (#52).
    if: false
    # A hung step fails the job instead of running until the 6 h limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # Linux runner (production target)
    container:
      image: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    # curl and lsof for the matchmaking scripts; apt retried on mirror errors (#453).
    - name: Install curl and lsof
      run: scripts/ci-apt-install.sh curl lsof
      timeout-minutes: 26  # above ci-apt-install.sh's worst case, 24 min 20 s (#659)

    # Node from the official builds, not the Ubuntu mirrors (#453).
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sdk/ts/package-lock.json', 'Packages/control-plane/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build SDK (required by CLI)
      working-directory: sdk/ts
      run: |
        npm ci
        npm run build

    - name: Install CLI dependencies
      working-directory: Tools/CLI
      run: npm ci

    - name: Build matchmaking control plane
      working-directory: Packages/control-plane
      run: |
        npm ci
        npm run build

    - name: Build GameServer
      run: swift build --package-path Examples/GameDemo

    - name: Run Matchmaking E2E (control plane + GameServer, no nginx)
      env:
        REDIS_HOST: redis  # Service hostname when job runs in container
        MATCHMAKING_MIN_WAIT_MS: "0"  # Allow immediate match in CI (no periodic tick)
      run: |
        bash Tools/CLI/scripts/internal/run-matchmaking-full-with-test.sh

    - name: Run Matchmaking MVP All Encodings (jsonObject, opcodeJsonArray, messagepack)
      env:
        REDIS_HOST: redis
        MATCHMAKING_MIN_WAIT_MS: "0"
      run: |
        bash Tools/CLI/scripts/internal/run-matchmaking-full-encodings.sh
