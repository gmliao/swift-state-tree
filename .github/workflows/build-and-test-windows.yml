# This workflow builds and tests the Swift package on Windows, and runs the DemoServer E2E scenarios.
#
# Windows is in testing. The job's check shows red when it fails, but it is non-blocking only as long
# as it is NOT a required check: do not add it to the required checks until it has been green for a
# while (issue #845).
#
# Written from what passes on one Windows 11 host (Swift 6.4.3, VS2022 build tools, default SwiftPM
# backend), and the build and test steps are confirmed on a hosted runner (run 45722997857: windows-2022,
# green). The E2E steps were written from the same host (29 scenarios pass there in each of the three
# encodings); their first runner run is the test of port 8080 and of the timeouts.
#
# SwiftBuild backend and C targets: the default backend failed on any C target (`stdlib.h` not found)
# ONLY under VS 2019 BuildTools 14.29; under VS 2022 (MSVC 14.42) the default backend and
# `--build-system native` both pass, so no `--build-system` flag is used. The windows-2022 image has a
# VS 2022 C++ toolset and a Windows SDK, and `swift build` finds them without a vcvars step.
# SwiftStateTreeNIOProvisioning is not built on Windows (the manifest leaves it out: AsyncHTTPClient's
# C target needs strptime); that is a separate cause from the one above.

name: Swift Build & Test (Windows)

on:
  push:
    # Experiment branches (exp/**) get the same CI as in the Linux workflow.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'
  pull_request:
    # Experiment branches (exp/**) get the same CI as in the Linux workflow.
    branches: [ "main", "exp/**" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Notes/**'
      - '.devcontainer/**'
      - 'README*'

permissions:
  contents: read

concurrency:
  group: build-and-test-windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: build and test (Windows)
    runs-on: windows-2022   # has Visual Studio 2022; windows-latest may move to a newer image
    # The workflow run stays green when this job fails, but the job's own check still shows red.
    # Non-blocking only because the check is not required; keep it out of the required checks.
    continue-on-error: true
    timeout-minutes: 60
    env:
      # One place for the toolchain version: the install step and the build cache key both read it, so a
      # bump cannot restore dependency builds made with the old compiler.
      SWIFT_VERSION: 6.4.3

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # The action installs the release named by SWIFT_VERSION on a hosted runner. It is pinned by full commit SHA, but the
    # Linux jobs also pin the image by digest; this action downloads the installer without a pinned
    # digest, so the parity is partial.
    - name: Install Swift
      uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
      with:
        swift-version: swift-${{ env.SWIFT_VERSION }}-release
        swift-build: ${{ env.SWIFT_VERSION }}-RELEASE

    - name: Show toolchain
      run: swift --version

    # Build cache (#878, option 1): the root package's .build only, which holds its dependency
    # checkouts and the compiled dependencies (swift-syntax and the rest); the repository's own
    # modules rebuild because the checkout gives their sources new mtimes. Examples/Demo/.build is NOT
    # cached: it depends on the library by path, and an incremental build of such a package can run
    # objects compiled against two struct layouts (Notes/solutions/2026-11-19-a-stale-example-build-
    # crashes-after-a-library-layout-change.md; CI builds each package fresh so far). Keyed by exact
    # key only (no restore-keys): the runner image (its MSVC and SDK), the toolchain, and the two named
    # package files; never a '**' glob, which the post step would evaluate again over .build.
    # actions/cache saves in its post step, only when the job succeeded and the key was not an exact hit.
    - name: Build cache key
      id: buildcache
      shell: bash
      run: echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Build cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .build
        key: swiftbuild-${{ runner.os }}-${{ steps.buildcache.outputs.image }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

    # The cache holds the debug and release links of the run that saved it (excluding them from the
    # path with `!.build/debug` did not keep them out of the archive). A restored link made SwiftPM warn
    # "unable to create symbolic link ... already exists" in the Build and Tests steps, and left
    # .build/debug as the cache's link, not the build's own. `rmdir` without /s removes only a link or
    # an empty directory (a link's target is left alone) and fails on a real non-empty directory, which
    # is then kept and reported.
    - name: Remove the restored build links
      shell: bash
      run: |
        # The tool follows the link's type (the tag `dir /AL` prints), never "rmdir failed": `del` on a
        # <SYMLINKD> or <JUNCTION> deletes the top-level files inside its target.
        for link in debug release; do
          path=".build/$link"
          win="$(cygpath -w "$path")"
          entry="$(cmd //c "dir /AL .build" 2>/dev/null | tr -d '\015' | grep -E "<SYMLINK> +$link( |$)" || true)"
          if [ -n "$entry" ]; then
            # A file-type symlink: rmdir refuses it, del removes just the link.
            if cmd //c del //q "$win" >/dev/null 2>&1; then
              echo "removed $path (file-type link): $entry"
            else
              echo "::warning::$path is a file-type link that del could not remove: $entry"
            fi
          elif [ ! -e "$path" ] && [ ! -L "$path" ]; then
            echo "$path: absent"
          elif cmd //c rmdir //q "$win" >/dev/null 2>&1; then
            echo "removed $path"
          else
            echo "::warning::$path exists and is not a link or an empty directory; kept, SwiftPM may warn about it"
            cmd //c "dir /A .build" 2>&1 | tr -d '\015' | grep -E "debug|release" || true
          fi
        done

    # Same single debug build that every test run reuses, as on Linux.
    # Not built on Windows: SwiftStateTreeNIOProvisioning (left out of the manifest there).
    - name: Build
      run: swift build --build-tests

    # The whole suite. POSIX-only suites (ProcessSignalsTests, ShutdownSignalsTests) are compiled
    # out on Windows.
    - name: Tests
      shell: bash
      env:
        # The shared runners stall for seconds: the tests' hang bounds use their slow scale (#888).
        SST_SLOW_RUNNER: "1"
      run: |
        set -o pipefail
        swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/tests.log" \
          || { echo "::error title=Tests::the tests failed"; exit 1; }
        scripts/check-test-run.sh "$RUNNER_TEMP/tests.log" "Tests"
      timeout-minutes: 30

    - name: Keep the test log
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: windows-tests-log
        path: ${{ runner.temp }}/tests.log
        retention-days: 3
        if-no-files-found: ignore

    - name: Build DemoServer
      id: demoserver
      if: ${{ !cancelled() }}
      working-directory: Examples/Demo
      run: swift build --product DemoServer

    # These steps run after a failed Tests step too (not after a cancel), so a flaky unit test does not
    # hide the E2E result; the failed step still fails the job. The E2E step itself needs the
    # DemoServer build and the CLI build to have succeeded.
    # E2E against the DemoServer.exe built above, in the three encodings (as e2e-tests.yml does on
    # Linux). The leaf scripts of Tools/CLI/package.json are called (`test:e2e:counter` and so on), not
    # the composite `test:e2e:<encoding>` ones: those start with a POSIX `VAR=value npm run ...`
    # prefix, which npm runs through cmd.exe on Windows and which fails there.
    - name: Set up Node.js
      if: ${{ !cancelled() }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20

    - name: Build the SDK and the CLI
      id: cli
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -e
        (cd sdk/ts && npm ci && npm run build)
        (cd Tools/CLI && npm ci && npm run build && npm run test:cli:unit)

    - name: E2E tests
      if: ${{ !cancelled() && steps.demoserver.outcome == 'success' && steps.cli.outcome == 'success' }}
      shell: bash
      timeout-minutes: 30
      env:
        HOST: 127.0.0.1
        PORT: "8080"
        # assertConverged (#79): DemoServer mounts the debug state routes, the CLI sends the admin key.
        ENABLE_DEBUG_STATE_ROUTES: "true"
        E2E_ADMIN_KEY: demo-admin-key
        # A convergence mismatch fails the run.
        E2E_CONVERGENCE_GATING: "true"
        MATCHMAKING_MODE: direct
      run: |
        set -u
        logs="$RUNNER_TEMP/e2e-logs"
        mkdir -p "$logs"
        bin=$(cd Examples/Demo && swift build --show-bin-path)
        exe="$(cygpath -u "$bin")/DemoServer.exe"
        echo "DemoServer: $exe"
        failed=0
        # Seconds each encoding may use in all; a hang in one cannot starve the next (4 x 7 min fits
        # the step's 30 min; a green encoding takes under a minute). One command gets at most 240 s.
        budget=420

        listening() { netstat -ano | grep LISTENING | grep -q ":$PORT "; }

        # Stops any DemoServer and waits until the port is free: a server left on the port would
        # answer the readiness check of the next one.
        stop_server() {
          taskkill //F //IM DemoServer.exe >/dev/null 2>&1 || true
          for _ in $(seq 1 20); do
            listening || return 0
            sleep 1
          done
          echo "FAIL  port $PORT is still in use 20 s after the server was stopped"
          return 1
        }

        # limit: seconds the next command may use (0 when this encoding's budget is used up).
        set_limit() {
          local left=$((deadline - SECONDS))
          if [ "$left" -gt 240 ]; then limit=240; elif [ "$left" -gt 0 ]; then limit=$left; else limit=0; fi
        }

        # check NAME COMMAND...: runs in Tools/CLI, keeps the output, counts a failure.
        check() {
          local name=$1; shift
          local log="$logs/${enc}-${name//[^A-Za-z0-9._-]/_}.log"
          set_limit
          if [ "$limit" = 0 ]; then
            echo "FAIL  $enc  $name  (not run: the $budget s budget of this encoding is used up)"
            failed=$((failed + 1)); return
          fi
          if (cd Tools/CLI && timeout "$limit" "$@") >"$log" 2>&1; then
            echo "PASS  $enc  $name"
          else
            echo "FAIL  $enc  $name  (exit $?)"; tail -n 20 "$log"; failed=$((failed + 1))
          fi
        }

        for enc in json jsonOpcode opcode messagepack; do
          case "$enc" in
            json) se=jsonObject ;;
            jsonOpcode) se=opcodeJsonArray ;;
            # Opcode JSON messages with payload compression on (#543).
            opcode) se=opcodeJsonArray ;;
            messagepack) se=messagepack ;;
          esac
          echo "::group::DemoServer $enc"
          start=$SECONDS
          deadline=$((SECONDS + budget))
          if ! stop_server; then
            failed=$((failed + 1)); echo "::endgroup::"; continue
          fi
          (cd Examples/Demo && TRANSPORT_ENCODING=$enc "$exe") >"$logs/server-$enc.log" 2>&1 &
          pid=$!
          up=0
          for _ in $(seq 1 60); do
            # A server that exited cannot be the one that answers.
            kill -0 "$pid" 2>/dev/null || break
            if curl -s --max-time 2 -o /dev/null "http://$HOST:$PORT/schema"; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then
            echo "FAIL  $enc  the server did not come up within 60 s"; cat "$logs/server-$enc.log"
            failed=$((failed + 1)); stop_server || true
            echo "::endgroup::"; continue
          fi

          if [ "$enc" = json ]; then
            check protocol-mixed-encoding npm run test-mixed-encoding
            check protocol-packet-encoding npm run test-packet-encoding
            check protocol-encoding-integration npm run test-encoding-integration
            check protocol-server-opcode-decoding npm run test-server-opcode-decoding
          fi
          check counter npm run test:e2e:counter -- --state-update-encoding "$se"
          check cookie npm run test:e2e:cookie -- --state-update-encoding "$se"
          check cookie-multi npm run test:e2e:cookie:multi -- --state-update-encoding "$se"
          check reevaluation npm run test:e2e:reevaluation -- --state-update-encoding "$se"

          if [ "$enc" = messagepack ]; then
            # The dropped patch must be caught: this run has to fail with a /count mismatch. No leaf
            # script runs it, so the CLI is called here.
            # MSYS_NO_PATHCONV: Git Bash would turn the argument /count into a Windows path.
            flog="$logs/messagepack-fault-injection.log"
            set_limit
            if [ "$limit" = 0 ]; then
              echo "FAIL  messagepack  fault-injection (not run: the $budget s budget of this encoding is used up)"
              failed=$((failed + 1))
            elif (cd Tools/CLI && MSYS_NO_PATHCONV=1 timeout "$limit" npx tsx src/cli.ts script -u "ws://$HOST:$PORT/game/counter" -l counter -s scenarios/fault/counter-drop-one-patch.json --state-update-encoding messagepack --fault-drop-patch /count --convergence-gating) >"$flog" 2>&1; then
              echo "FAIL  messagepack  fault-injection passed, it must fail"; failed=$((failed + 1))
            elif grep -q 'CONVERGENCE MISMATCH (gating) fault-drop-one-patch' "$flog" && grep -q '^  /count: client=' "$flog"; then
              echo "PASS  messagepack  fault-injection (failed with a /count mismatch, as required)"
            else
              echo "FAIL  messagepack  fault-injection failed for another reason"; tail -n 20 "$flog"; failed=$((failed + 1))
            fi
          fi

          stop_server || failed=$((failed + 1))
          echo "$enc took $((SECONDS - start)) s"
          echo "::endgroup::"
        done

        echo "failed checks: $failed"
        [ "$failed" = 0 ]

    # Also after a failure, a timeout or a cancel: a server left running would hold port 8080.
    - name: Stop DemoServer
      if: always()
      shell: bash
      run: taskkill //F //IM DemoServer.exe >/dev/null 2>&1 || true

    - name: Keep the E2E logs
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: windows-e2e-logs
        path: ${{ runner.temp }}/e2e-logs
        retention-days: 3
        if-no-files-found: ignore
